# Example service for your existing media stack. Copy it into your compose file,
# or run it alongside: `docker compose up -d`.
# Values come from a .env file next to this one (see .env.example).
services:
  votarr:
    image: ghcr.io/alexpepicelli/votarr:latest # or `build: .` to build from this checkout
    container_name: votarr
    restart: unless-stopped
    environment:
      # Seerr/Radarr can instead be connected in Admin → Settings (which overrides these).
      SEERR_URL: ${SEERR_URL:-http://seerr:5055}
      SEERR_API_KEY: ${SEERR_API_KEY}
      RADARR_URL: ${RADARR_URL:-http://radarr:7878}
      RADARR_API_KEY: ${RADARR_API_KEY}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      OWNER_SEERR_USER_ID: ${OWNER_SEERR_USER_ID:-}
      TZ: ${TZ:-Australia/Adelaide}
    volumes:
      - ./data:/data # SQLite database + backups
    # ports: ["3000:3000"]  # only if you want LAN access without the tunnel
    networks: [media]

networks:
  media:
    external: true # the network radarr/seerr/cloudflared already share; rename to match
