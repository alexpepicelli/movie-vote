# Votarr for YAMS. Paste the `votarr:` block under `services:` in
# <INSTALL_DIRECTORY>/docker-compose.custom.yaml (usually /opt/yams). It joins YAMS's network
# automatically, so it reaches Radarr and Seerr by container name.
#
# Needs these in YAMS's .env (<INSTALL_DIRECTORY>/.env):
#   SEERR_API_KEY=...    Seerr → Settings → General → API Key
#   RADARR_API_KEY=...   Radarr → Settings → General → API Key
#   VOTARR_URL=https://votarr.example.com   the Cloudflare Tunnel hostname friends use
# PUID, PGID, TZ and INSTALL_DIRECTORY are already set by YAMS.

services:
  votarr:
    build: /opt/votarr # wherever you cloned this repo on the server
    image: votarr:local
    container_name: votarr
    user: ${PUID}:${PGID}
    environment:
      - TZ=${TZ}
      - ORIGIN=${VOTARR_URL}
      - SEERR_URL=http://seerr:5055 # use http://jellyseerr:5055 if your container is named that
      - SEERR_API_KEY=${SEERR_API_KEY}
      - RADARR_URL=http://radarr:7878
      - RADARR_API_KEY=${RADARR_API_KEY}
      # Your Seerr user ID (Seerr → Users; the admin is usually 1). Makes you the owner, so
      # nobody else can claim it by signing in first.
      - OWNER_SEERR_USER_ID=1
    volumes:
      - ${INSTALL_DIRECTORY}/config/votarr:/data # database, poster cache
    # Only needed if cloudflared runs on the host (not as a container on the YAMS network):
    # ports:
    #   - 3069:3000
    labels:
      - com.centurylinklabs.watchtower.enable=false # built locally; nothing for Watchtower to pull
    restart: unless-stopped
