# Votarr for YAMS. Paste the `votarr:` block under `services:` in
# <INSTALL_DIRECTORY>/docker-compose.custom.yaml (usually /opt/yams). It joins YAMS's network
# automatically, so it reaches Radarr and Seerr by container name. The image is built by
# GitHub Actions, so there's nothing to clone or build on the server.
#
# Nothing to fill in: connect Seerr and Radarr in Votarr under Admin → Settings after you
# sign in. PUID, PGID, TZ and INSTALL_DIRECTORY come from YAMS.

services:
  votarr:
    image: ghcr.io/alexpepicelli/votarr:latest
    container_name: votarr
    environment:
      - PUID=${PUID} # Votarr creates its data folder and runs as this user
      - PGID=${PGID}
      - TZ=${TZ}
      # Your Seerr user ID (Seerr → Users; the admin is usually 1). Makes you the owner, so
      # nobody else can claim it by signing in first.
      - OWNER_SEERR_USER_ID=1
    volumes:
      - ${INSTALL_DIRECTORY}/config/votarr:/config # database, settings, poster cache
    # Needed if cloudflared runs on the host (its routes point at http://localhost:...).
    # 127.0.0.1 keeps it off the LAN; the tunnel then points at http://localhost:3069.
    # ports:
    #   - 127.0.0.1:3069:3000
    restart: unless-stopped
